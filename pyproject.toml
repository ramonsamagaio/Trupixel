[project]
name = "trupixel"
version = "0.1.0"
description = "AI-native headless pixel-art reconstruction engine with MCP and community learning."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "Pillow>=10.4",
  "numpy>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "python-multipart>=0.0.9",
  "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[project.scripts]
trupixel = "pixelforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixelforge"]
